<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2440"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8b84b"/>
      <stop offset="100%" stop-color="#c8942f"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
  <circle cx="200" cy="200" r="170" fill="url(#navyGrad)"/>

  <!-- Top arc text: CHAMBER OF COMMERCE -->
  <path id="topArc" d="M 55 160 A 160 160 0 0 1 345 160" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" fill="#f4e4bc" letter-spacing="1.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">CHAMBER OF COMMERCE</textPath>
  </text>

  <!-- Bottom arc text: place-holder city/est -->
  <path id="bottomArc" d="M 90 275 A 130 130 0 0 0 310 275" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="500" fill="#e8b84b" letter-spacing="4">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">FUNDATUM AB 2026</textPath>
  </text>

  <!-- Small decorative divider dots at arc ends -->
  <circle cx="200" cy="235" r="2.5" fill="#e8b84b"/>

  <!-- Central emblem: classical building (columns + pediment) representing commerce & civic trust -->
  <g transform="translate(200,205)">
    <!-- Pediment / roof -->
    <polygon points="-70,-55 0,-90 70,-55" fill="url(#goldGrad)"/>
    <rect x="-75" y="-58" width="150" height="10" fill="#e8b84b"/>

    <!-- Columns -->
    <g fill="#f4e4bc">
      <rect x="-58" y="-44" width="12" height="70"/>
      <rect x="-30" y="-44" width="12" height="70"/>
      <rect x="-6"  y="-44" width="12" height="70"/>
      <rect x="18"  y="-44" width="12" height="70"/>
      <rect x="46"  y="-44" width="12" height="70"/>
    </g>

    <!-- Base / steps -->
    <rect x="-80" y="26" width="160" height="8" fill="#e8b84b"/>
    <rect x="-88" y="34" width="176" height="8" fill="#c8942f"/>
    <rect x="-96" y="42" width="192" height="8" fill="#1e3a5f" stroke="#e8b84b" stroke-width="1.5"/>
  </g>

  <!-- Laurel-style flourishes flanking the emblem -->
  <g stroke="#e8b84b" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 95 260 Q 75 240 85 210 Q 95 240 105 250"/>
    <path d="M 95 260 Q 80 260 78 235"/>
    <path d="M 95 260 Q 82 275 90 290"/>

    <path d="M 305 260 Q 325 240 315 210 Q 305 240 295 250"/>
    <path d="M 305 260 Q 320 260 322 235"/>
    <path d="M 305 260 Q 318 275 310 290"/>
  </g>
</svg>
