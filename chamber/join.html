<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="color-scheme" content="light">

    <title>Wilmington Chamber of Commerce | Join</title>

    <meta
        name="description"
        content="Welcome to the Wilmington Chamber of Commerce. Discover local events, weather, businesses, and opportunities to connect with our community."
    >
    <meta name="author" content="Jorge Henrique de Souza Lima">

    <!-- Favicon -->
    <link rel="icon" href="images/favicon.ico">

    <!-- FB Open Graph -->
    <meta property="og:title" content="Wilmington Chamber of Commerce">
    <meta
        property="og:description"
        content="Connect with Wilmington businesses, community events, resources, and opportunities through the Wilmington Chamber of Commerce."
    >
    <meta
        property="og:image"
        content="https://jorgehlima.github.io/wdd231/chamber/images/chamber-logo.png"
    >
    <meta
        property="og:url"
        content="https://jorgehlima.github.io/wdd231/chamber/index.html"
    >
    <meta property="og:type" content="website">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/large.css">

    <!-- Scripts -->
    <script src="scripts/navigation.js" defer></script>
    <script src="scripts/date.js" defer></script>
    <script src="scripts/theme.js" defer></script>

</head>

<body>

    <header>
        <div class="header-container">
            <a href="index.html" class="brand">

                <!-- Logo image -->
                <img
                    src="images/chamber-logo.png"
                    alt="Wilmington Chamber of Commerce logo"
                    class="logo"
                    width="500"
                    height="300"
                >
            </a>
            
            <!-- Hamburger button -->
            <button
                id="menu"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false">
            </button>
        
            <!-- Navigation section -->
            <nav id="navigation">
                <ul class="navigation">
                    <li>
                        <a href="index.html">Home</a>
                    </li>

                    <li>
                        <a href="directory.html">Directory</a>
                    </li>

                    <li>
                        <a href="join.html" class="active">Join</a>
                    </li>

                    <li>
                        <a href="discover.html">Discover</a>
                    </li>

                    <!--Dark mode button-->
                    <li>
                        <button
                            id="theme-toggle"
                            type="button"
                            aria-label="Switch to dark mode"
                            title="Switch to dark mode"
                        >
                            ◐
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

    </main>

    <footer>
        <div class="footer-container">

            <div class="contact-info">
                <p><strong>Wilmington, NC Chamber of Commerce</strong></p>
                <p>123 Market Street</p>
                <p>Wilmington, NC 28401</p>
                <p>info@wilmingtonchamber.org</p>
                <p>(910) 555-1234</p>
            </div>

            <div class="social-links">
                <a
                    href="https://www.youtube.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="YouTube"
                >
                    <img
                        src="images/youtube.svg"
                        alt=""
                        width="32"
                        height="32"
                    >
                </a>

                <a
                    href="https://www.facebook.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Facebook"
                >
                    <img
                        src="images/facebook.svg"
                        alt=""
                        width="32"
                        height="32"
                    >
                </a>

                <a
                    href="https://www.linkedin.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="LinkedIn"
                >
                    <img
                        src="images/linkedin.svg"
                        alt=""
                        width="32"
                        height="32"
                    >
                </a>
            </div>

            <div class="development-info">
                <p>WDD 231 Class Project</p>
                <p>Jorge Henrique de Souza Lima</p>

                <p>
                    &copy; <span id="currentyear"></span>
                    Wilmington, NC
                </p>

                <p id="lastModified"></p>
            </div>

        </div>
    </footer>
</body>
</html>
